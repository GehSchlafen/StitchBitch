<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StitchBitch</title>
<style>
  :root { color-scheme: dark }
  * { box-sizing: border-box }
  body { margin:0; font:15px/1.5 system-ui,sans-serif; background:#14161a; color:#e8e8e8 }
  header { padding:14px 20px; border-bottom:1px solid #2a2e35; display:flex; gap:16px; align-items:baseline }
  h1 { margin:0; font-size:19px } header small { color:#8a919c }
  main { display:grid; grid-template-columns:330px 1fr; min-height:calc(100vh - 55px) }
  form { padding:16px; border-right:1px solid #2a2e35; display:flex; flex-direction:column; gap:10px;
         overflow:auto; max-height:calc(100vh - 55px) }
  label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:#b7bcc4 }
  input,select,button { font:inherit; padding:7px 9px; border-radius:8px; border:1px solid #333a44; background:#1b1f26; color:#eee }
  .row { display:flex; gap:8px } .row label { flex:1 }
  button { background:#2a303a; cursor:pointer }
  button.primary { background:#3d7dff; border-color:#3d7dff; font-weight:600 }
  button:disabled { opacity:.5; cursor:default }
  #dl { display:none; text-align:center; text-decoration:none; color:#0b0d10; background:#37d07a; border-color:#37d07a }
  #status { font-size:12px; color:#8a919c; min-height:16px }
  .hint { font-size:12px; color:#8a919c }
  .chk { flex-direction:row; align-items:center; gap:6px; color:#b7bcc4; font-size:13px }
  .palette { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:6px }
  .sw { flex-direction:row; align-items:center; gap:5px; padding:3px 7px; border:1px solid #333a44; border-radius:8px;
        background:#1b1f26; cursor:pointer; font-size:12px; color:#cfd3da }
  .sw.off { opacity:.45 }
  .chip { width:14px; height:14px; border-radius:4px; border:1px solid #0007; display:inline-block }
  .right { display:flex; flex-direction:column; min-width:0 }
  .tabs { display:flex; gap:6px; padding:8px 12px; border-bottom:1px solid #2a2e35; flex-wrap:wrap; align-items:center }
  .sp { flex:1 }
  .tool { background:#1b1f26; padding:6px 9px }
  .tool.active { background:#3d7dff; border-color:#3d7dff }
  .stage { position:relative; flex:1; overflow:hidden; cursor:grab; touch-action:none;
           background:repeating-conic-gradient(#1a1d22 0 25%,#171a1f 0 50%) 0/24px 24px }
  #edit { position:absolute; left:0; top:0; transform-origin:0 0; image-rendering:pixelated }
  #preview { position:absolute; left:0; top:0; transform-origin:0 0; max-width:none; box-shadow:0 8px 40px #0007; display:none }
  @media (max-width:860px){ main{grid-template-columns:1fr} form{border-right:0;border-bottom:1px solid #2a2e35;max-height:none} }
</style></head><body>
<header><h1>StitchBitch</h1><small>Bild / SVG &rarr; Stickdatei</small></header>
<main>
  <form id="form">
    <label>Bild oder SVG<input id="file" type="file" accept="image/*,.svg" required></label>
    <div class="row">
      <label>Breite mm<input id="width" type="number" value="100" min="5" step="1"></label>
      <label>Farben<input id="colors" type="number" value="16" min="2" max="64"></label>
      <label>Merge %<input id="merge" type="number" value="5" min="0" max="50" step="1"></label>
    </div>
    <div class="row">
      <label>Stichlaenge mm<input id="stitch" type="number" placeholder="auto" min="0.3" step="0.1"></label>
      <label>Reihen mm<input id="row" type="number" placeholder="auto" min="0.15" step="0.05"></label>
    </div>
    <div class="row">
      <label>Winkel &deg;<input id="angle" type="number" value="45" step="5"></label>
      <label>Format<select id="format">__FORMATS__</select></label>
    </div>
    <label>Motiv drehen <span id="rotval">0&deg;</span>
      <input id="rotate" type="range" min="-180" max="180" step="1" value="0"></label>
    <div class="row">
      <label class="chk"><input id="borden" type="checkbox"> Patch-Rand</label>
      <label>Rand mm<input id="bwidth" type="number" value="3" min="0.5" step="0.5"></label>
      <label>Randfarbe<input id="bcolor" type="color" value="#000000"></label>
    </div>
    <div id="palette-wrap" style="display:none">
      <div class="hint" id="palhint">Palette - abwaehlen = nicht sticken. (BG) = Hintergrund.</div>
      <div id="palette" class="palette"></div>
      <button type="button" id="repal" class="tool">Palette aktualisieren</button>
    </div>
    <button id="go" type="submit" class="primary">Stricken</button>
    <a id="dl">Download Stickdatei</a>
    <div id="status"></div>
    <div class="hint">Editor: 🩹 Radierer (Skalpel), 🖌️ Pinsel (Zielfarbe), 💧 Pipette (Farbe aufnehmen),
      ✋ verschieben. Mausrad = Zoom.</div>
  </form>
  <div class="right">
    <div class="tabs">
      <button type="button" class="tool active" id="tab-edit">Bearbeiten</button>
      <button type="button" class="tool" id="tab-prev">Vorschau</button>
      <span class="sp"></span>
      <button type="button" class="tool active" data-tool="hand" title="Verschieben">&#9995;</button>
      <button type="button" class="tool" data-tool="erase" title="Radierer / Skalpel">&#129657;</button>
      <button type="button" class="tool" data-tool="paint" title="Pinsel (Zielfarbe)">&#128396;</button>
      <button type="button" class="tool" data-tool="pick" title="Pipette">&#128167;</button>
      <input id="tcolor" type="color" value="#ff0000" title="Zielfarbe" style="width:40px;padding:2px">
      <button type="button" class="tool" id="replace" title="Pipettenfarbe durch Zielfarbe ersetzen">Farbe ersetzen</button>
      <label style="flex-direction:row;align-items:center;gap:6px;color:#b7bcc4">Gr&ouml;&szlig;e
        <input id="brush" type="range" min="2" max="140" value="30" style="width:90px"></label>
      <span class="sp"></span>
      <button type="button" class="tool" id="zin" title="Zoom +">&#65291;</button>
      <button type="button" class="tool" id="zout" title="Zoom -">&#65293;</button>
      <button type="button" class="tool" id="zfit" title="Einpassen">Fit</button>
      <button type="button" class="tool" id="undo" title="Rueckgaengig">&#8630;</button>
      <button type="button" class="tool" id="reset" title="Original">Reset</button>
    </div>
    <div class="stage" id="stage">
      <canvas id="edit"></canvas>
      <img id="preview" alt="Vorschau">
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const canvas = $('edit'), ctx = canvas.getContext('2d', { willReadFrequently: true });
const stage = $('stage');
// Transform je Ansicht (s=scale, x/y=offset)
const view = { edit: { s: 1, x: 0, y: 0 }, prev: { s: 1, x: 0, y: 0 } };
let which = 'edit', tool = 'hand', brush = 30, target = '#ff0000', pickColor = null;
let baseImage = null, srcName = 'upload.png', editorOK = false;
let undoStack = [], serverRot = 0, previewRot = 0;

function hexRgb(h){ const n = parseInt(h.replace('#',''),16); return {r:(n>>16)&255, g:(n>>8)&255, b:n&255}; }
function fitEl(k){
  const el = k === 'edit' ? canvas : $('preview');
  const w = (k === 'edit' ? canvas.width : $('preview').naturalWidth) || 1;
  const h = (k === 'edit' ? canvas.height : $('preview').naturalHeight) || 1;
  const sw = stage.clientWidth, sh = stage.clientHeight, v = view[k];
  v.s = Math.min(sw / w, sh / h) * 0.95 || 1;
  v.x = (sw - w * v.s) / 2; v.y = (sh - h * v.s) / 2;
  applyView(k);
}
function applyView(k){
  const v = view[k], el = k === 'edit' ? canvas : $('preview');
  let t = 'translate(' + v.x + 'px,' + v.y + 'px) scale(' + v.s + ')';
  if (k === 'prev') t += ' rotate(' + (previewRot - serverRot) + 'deg)';
  el.style.transform = t;
}
function setView(k){
  which = k;
  canvas.style.display = k === 'edit' ? 'block' : 'none';
  $('preview').style.display = (k === 'prev' && $('preview').src) ? 'block' : 'none';
  $('tab-edit').classList.toggle('active', k === 'edit');
  $('tab-prev').classList.toggle('active', k === 'prev');
}
function toImg(e){
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / view.edit.s, y: (e.clientY - r.top) / view.edit.s };
}
function toBlob(){ return new Promise(res => { try { canvas.toBlob(res, 'image/png'); } catch (e) { res(null); } }); }

/* ---------- Datei laden ---------- */
$('file').addEventListener('change', () => {
  const f = $('file').files[0]; if (!f) return;
  srcName = f.name;
  const im = new Image();
  im.onload = () => {
    let w = im.naturalWidth, h = im.naturalHeight, cap = 2000;
    if (Math.max(w, h) > cap) { const k = cap / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
    canvas.width = w; canvas.height = h;
    try { ctx.clearRect(0, 0, w, h); ctx.drawImage(im, 0, 0, w, h); editorOK = true; }
    catch (e) { editorOK = false; }
    baseImage = im; undoStack = []; setView('edit'); fitEl('edit');
    serverRot = 0; previewRot = 0; $('rotate').value = 0; applyView('prev');
    $('preview').style.display = 'none'; $('dl').style.display = 'none';
    loadPalette();
  };
  im.onerror = () => { editorOK = false; $('status').textContent = 'Hinweis: Vorschau-Editor fuer dieses Format nicht verfuegbar (Original wird gestickt).'; loadPalette(); };
  im.src = URL.createObjectURL(f);
});

/* ---------- Palette ---------- */
async function loadPalette(){
  try {
    const b = (editorOK ? await toBlob() : null) || $('file').files[0];
    if (!b) return;
    const res = await fetch('/palette?filename=' + encodeURIComponent(srcName) + '&colors=' + $('colors').value,
                            { method: 'POST', body: b });
    const j = await res.json();
    if (!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
    const box = $('palette'); box.innerHTML = '';
    (j.colors || []).forEach(c => {
      const lab = document.createElement('label');
      lab.className = 'sw' + (c.bg ? ' off' : '');
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = !c.bg; cb.dataset.hex = c.hex.slice(1); cb.dataset.bg = c.bg ? '1' : '0';
      const chip = document.createElement('span'); chip.className = 'chip'; chip.style.background = c.hex;
      const txt = document.createElement('span');
      txt.textContent = c.hex.slice(1) + (c.bg ? ' (BG)' : '') + (c.count ? ' \u00d7' + c.count : '');
      lab.append(cb, chip, txt);
      cb.addEventListener('change', () => lab.classList.toggle('off', !cb.checked));
      box.append(lab);
    });
    $('palette-wrap').style.display = 'block';
    $('palhint').textContent = 'Palette - abwaehlen = nicht sticken. (BG) = Hintergrund.';
  } catch (e) { $('palhint').textContent = 'Palette-Fehler: ' + e.message; $('palette-wrap').style.display = 'block'; }
}
$('repal').addEventListener('click', loadPalette);
$('colors').addEventListener('change', loadPalette);

/* ---------- Werkzeuge ---------- */
document.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => {
  tool = b.dataset.tool;
  document.querySelectorAll('[data-tool]').forEach(x => x.classList.toggle('active', x === b));
  stage.style.cursor = tool === 'hand' ? 'grab' : 'crosshair';
}));
$('tcolor').addEventListener('input', () => { target = $('tcolor').value; });
$('brush').addEventListener('input', () => { brush = +$('brush').value; });

function pushUndo(){ try { undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height)); if (undoStack.length > 6) undoStack.shift(); } catch (e) {} }
$('undo').addEventListener('click', () => { const s = undoStack.pop(); if (s) { ctx.putImageData(s, 0, 0); stale(); } });
$('reset').addEventListener('click', () => {
  if (!baseImage) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(baseImage, 0, 0, canvas.width, canvas.height);
  undoStack = []; loadPalette();
});
function stale(){ $('palhint').textContent = 'Bearbeitet - Palette ggf. aktualisieren.'; }

function paintDot(p){
  ctx.globalCompositeOperation = (tool === 'erase') ? 'destination-out' : 'source-over';
  ctx.fillStyle = (tool === 'erase') ? '#000' : target;
  ctx.beginPath(); ctx.arc(p.x, p.y, brush / 2, 0, Math.PI * 2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
}
function paintSeg(a, b){
  ctx.globalCompositeOperation = (tool === 'erase') ? 'destination-out' : 'source-over';
  ctx.strokeStyle = (tool === 'erase') ? '#000' : target;
  ctx.lineWidth = brush; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
}

let panning = null, drawing = false, last = null;
stage.addEventListener('pointerdown', e => {
  if (!editorOK || which !== 'edit') return;
  stage.setPointerCapture(e.pointerId);
  const p = toImg(e);
  if (tool === 'hand') { panning = { x: e.clientX, y: e.clientY }; stage.style.cursor = 'grabbing'; return; }
  if (tool === 'pick') {
    if (p.x < 0 || p.y < 0 || p.x >= canvas.width || p.y >= canvas.height) return;
    const d = ctx.getImageData(Math.floor(p.x), Math.floor(p.y), 1, 1).data;
    if (d[3] === 0) return;
    pickColor = target = '#' + [d[0], d[1], d[2]].map(v => v.toString(16).padStart(2, '0')).join('');
    $('tcolor').value = target; return;
  }
  pushUndo(); drawing = true; last = p; paintDot(p);
});
stage.addEventListener('pointermove', e => {
  if (panning) { view.edit.x += e.clientX - panning.x; view.edit.y += e.clientY - panning.y;
    panning = { x: e.clientX, y: e.clientY }; applyView('edit'); return; }
  if (drawing) { const p = toImg(e); paintSeg(last, p); last = p; }
});
function endStroke(){
  if (panning) { panning = null; stage.style.cursor = 'grab'; }
  if (drawing) { drawing = false; stale(); }
}
stage.addEventListener('pointerup', endStroke);
stage.addEventListener('pointercancel', endStroke);

$('replace').addEventListener('click', () => {
  if (!editorOK || !pickColor) { $('status').textContent = 'Erst mit der Pipette eine Farbe aufnehmen.'; return; }
  pushUndo();
  const s = hexRgb(pickColor), t = hexRgb(target), tol = 48;
  const id = ctx.getImageData(0, 0, canvas.width, canvas.height), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] === 0) continue;
    if (Math.abs(d[i] - s.r) <= tol && Math.abs(d[i + 1] - s.g) <= tol && Math.abs(d[i + 2] - s.b) <= tol) {
      d[i] = t.r; d[i + 1] = t.g; d[i + 2] = t.b;
    }
  }
  ctx.putImageData(id, 0, 0); stale();
});

/* ---------- Zoom / Pan ---------- */
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const k = which, el = k === 'edit' ? canvas : $('preview'), v = view[k];
  const r = el.getBoundingClientRect(), wr = stage.getBoundingClientRect();
  const ix = (e.clientX - r.left) / v.s, iy = (e.clientY - r.top) / v.s;
  const f = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  v.s = Math.min(25, Math.max(0.05, v.s * f));
  v.x = (e.clientX - wr.left) - ix * v.s; v.y = (e.clientY - wr.top) - iy * v.s;
  applyView(k);
}, { passive: false });
function zoomBy(f){ const v = view[which], sw = stage.clientWidth / 2, sh = stage.clientHeight / 2;
  const ix = (sw - v.x) / v.s, iy = (sh - v.y) / v.s; v.s = Math.min(25, Math.max(0.05, v.s * f));
  v.x = sw - ix * v.s; v.y = sh - iy * v.s; applyView(which); }
$('zin').addEventListener('click', () => zoomBy(1.25));
$('zout').addEventListener('click', () => zoomBy(1 / 1.25));
$('zfit').addEventListener('click', () => fitEl(which));
$('tab-edit').addEventListener('click', () => setView('edit'));
$('tab-prev').addEventListener('click', () => setView('prev'));

/* ---------- Drehen ---------- */
$('rotate').addEventListener('input', () => {
  previewRot = parseFloat($('rotate').value) || 0;
  $('rotval').textContent = previewRot + '\u00b0';
  applyView('prev');
});

/* ---------- Stricken ---------- */
$('form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const off = [...document.querySelectorAll('#palette input:not(:checked)')];
  const ignore = off.filter(c => c.dataset.bg !== '1').map(c => c.dataset.hex).join(',');
  const bgcolor = (off.find(c => c.dataset.bg === '1') || {}).dataset?.hex || '';
  const q = new URLSearchParams({
    filename: srcName, format: $('format').value, width: $('width').value, colors: $('colors').value,
    stitch: $('stitch').value, row: $('row').value, angle: $('angle').value, rotate: $('rotate').value,
    merge: $('merge').value, ignore, bgcolor,
    bcolor: $('borden').checked ? $('bcolor').value : '', bwidth: $('bwidth').value
  });
  const btn = $('go'); btn.disabled = true; $('status').textContent = 'Stricke ...'; $('dl').style.display = 'none';
  try {
    const body = (editorOK ? await toBlob() : null) || $('file').files[0];
    if (!body) throw new Error('Keine Datei');
    const res = await fetch('/convert?' + q, { method: 'POST', body });
    const j = await res.json();
    if (!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
    serverRot = parseFloat($('rotate').value) || 0;
    $('preview').src = 'data:image/png;base64,' + j.preview;
    setView('prev');
    const bin = atob(j.file), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const a = $('dl');
    a.href = URL.createObjectURL(new Blob([arr], { type: 'application/octet-stream' }));
    a.download = j.filename; a.style.display = 'block';
    const acc = (typeof j.accuracy === 'number') ? ' \u00b7 Treffer ' + (j.accuracy * 100).toFixed(1) + '%' : '';
    const dens = j.stitch_mm ? ' \u00b7 Stich/Reihe ' + j.stitch_mm + '/' + j.row_mm + ' mm' : '';
    $('status').textContent = j.stitches + ' Stiche \u00b7 ' + j.width_mm + '\u00d7' + j.height_mm + ' mm \u00b7 '
      + j.blocks + ' Farben' + dens + acc;
  } catch (e) { $('status').textContent = 'Fehler: ' + e.message; }
  finally { btn.disabled = false; }
});
$('preview').addEventListener('load', () => fitEl('prev'));
window.addEventListener('resize', () => { if (which === 'edit' && editorOK) fitEl('edit'); });
</script></body></html>
